population_size: 64
num_offsprings: 128
init_population_size: 500
select_criterion: 'keep_n_best' # 'avg' 'keep_n_best'
incoming_population_size: 0
init_mutation_rate_offspring: 0.9
init_mutation_rate_param: 0.9
final_mutation_rate_offspring: 0.1
final_mutation_rate_param: 0.1
max_offsprings_per_parent: 10000 # set to high number for no effect
init_mutation_noise: 0.05
final_mutation_noise: 0.05
translation_mutation_noise: 0.05
add_random_individuals_every: 0
num_generations: 50
refine_every_n_generations: 5
#convergence_threshold: 0.00
load_ordered_dv: True
refinement:
    full_refinement_frequency: 0
    use_refinement_break: True
    refinement_probability: 0.2
    optimize_steps: 50
    optimizer_lr: 0.01
    optimizer: 'Adam' # 'Adam' or 'SGD'
    final_optimization_steps: 200
    final_optimizer_lr: 0.01
